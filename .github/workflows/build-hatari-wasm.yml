name: Build Hatari WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [hatari-wasm]
    paths:
      - "hatari-lab.html"
      - ".github/workflows/build-hatari-wasm.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout MY ATARI ST
        uses: actions/checkout@v4
        with:
          ref: hatari-wasm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-m68k-linux-gnu binutils-m68k-linux-gnu

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Download prebuilt free EmuTOS ROM
        run: |
          set -euo pipefail
          ROM_URL="https://sourceforge.net/projects/emutos/files/snapshots/20260923-054535-02c2db75/emutos-1024k-20260923-054535-02c2db75.zip/download"
          curl -L --fail --retry 3 "$ROM_URL" -o /tmp/emutos-1024k.zip
          echo "cc2434b8e9955a9adf8a6903f6f6f24390337bbcd3418de61b99cf5f6a98761a  /tmp/emutos-1024k.zip" | sha256sum -c -
          mkdir -p /tmp/emutos /tmp/hatari-build/files
          unzip -q /tmp/emutos-1024k.zip -d /tmp/emutos
          ROM_FILE="$(find /tmp/emutos -type f -iname '*.img' | head -n 1)"
          test -n "$ROM_FILE"
          cp "$ROM_FILE" /tmp/hatari-build/files/tos.img
          test "$(stat -c%s /tmp/hatari-build/files/tos.img)" -ge 1048576

      - name: Build Hatari 2.6.1 for the browser
        run: |
          git clone --depth 1 --branch v2.6.1 https://github.com/hatari/hatari.git /tmp/hatari
          sed -i "/'--machine','ste'/i\\  '--tos','/share/hatari/tos.img'," /tmp/hatari/src/emscripten.js
          # Enable Hatari's built-in keyboard joystick on ST port 1 (arrows + right Ctrl).
          sed -i "/'--machine','ste'/i\\  '--joy1','keys'," /tmp/hatari/src/emscripten.js
          # The upstream browser preset points to a hard-drive directory that is not packaged.
          # Remove it: the test harness mounts floppy images directly through the virtual FS.
          python3 - <<'PY'
          p = '/tmp/hatari/src/emscripten.js'
          s = open(p).read()
          old = "  '-d','/share/hatari/fs/',\n"
          assert old in s, 'Could not locate default hard-drive argument'
          open(p, 'w').write(s.replace(old, '', 1))
          PY
          # Expose the Emscripten virtual filesystem so the web UI can mount user disks.
          python3 - <<'PY'
          p = '/tmp/hatari/src/CMakeLists.txt'
          s = open(p).read()
          old = r'\"cwrap\"]'
          new = r'\"cwrap\",\"FS\"]'
          assert old in s, 'Could not locate Emscripten runtime exports'
          open(p, 'w').write(s.replace(old, new, 1))
          PY
          emcmake cmake -S /tmp/hatari -B /tmp/hatari-build -G Ninja -DENABLE_TOOLS=OFF -DENABLE_LIBRETRO=OFF -DENABLE_DSP_EMU=OFF
          cmake --build /tmp/hatari-build --target hatari --parallel 2
          mkdir -p hatari
          cp /tmp/hatari-build/src/hatari.html hatari/hatari.html
          cp /tmp/hatari-build/src/hatari.js hatari/hatari.js
          cp /tmp/hatari-build/src/hatari.wasm hatari/hatari.wasm
          if [ -f /tmp/hatari-build/src/hatari.data ]; then cp /tmp/hatari-build/src/hatari.data hatari/hatari.data; fi
          # Strip Hatari's standalone page chrome and let its canvas occupy the iframe viewport.
          python3 - <<'PY'
          p = 'hatari/hatari.html'
          s = open(p, encoding='utf-8').read()
          css = '''html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000}body>span,.spinner,#status,#controls,#progress,#output{display:none!important}.emscripten_border{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0!important;overflow:hidden;background:#000}.emscripten_border canvas.emscripten{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border:0;background:#000}'''
          s = s.replace('</style>', css + '</style>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          ls -lh hatari/

      - name: Commit browser build to the test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hatari/
          if git diff --cached --quiet; then
            echo "Hatari build is already up to date."
          else
            git commit -m "Build Hatari WebAssembly runtime [skip ci]"
            git push origin HEAD:hatari-wasm
          fi
