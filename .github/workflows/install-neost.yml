name: Install NeoST WebAssembly engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official NeoST 0.6.2 release
        run: |
          mkdir -p neost
          curl -fL --retry 3 \
            https://github.com/habib256/neost/releases/download/0.6.2/NeoST-0.6.2-web-wasm.zip \
            -o /tmp/neost.zip
          unzip -o /tmp/neost.zip -d neost
          test -s neost/index.html
          test -s neost/index.js
          test -s neost/index.wasm
          test -s neost/index.data

      - name: Commit engine files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neost/
          git commit -m "Add official NeoST 0.6.2 WebAssembly engine" || echo "No changes to commit"
          git push
